<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="light">
<title>HTML共有くん</title>
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<!-- crossorigin は必須。これが無いと manifest だけ Cookie 無しで取りに行き 403 になる -->
<link rel="manifest" href="/app.webmanifest" crossorigin="use-credentials">
<meta name="apple-mobile-web-app-title" content="HTML共有くん">
<!-- 上バーの上端と同じ色。ここがずれるとステータスバーの周りが継ぎはぎになる -->
<meta name="theme-color" content="#0a4695">
<!-- 一覧の見た目と描画の正本。スマホの個別ページ側も同じものを読む -->
<script src="/page-list.js"></script>
<script src="/pull-to-refresh.js" defer></script>
<script>MyBriefsList.injectIntoHead();</script>
<style>
:root {
  --blue-deep: #0e0d6a;
  --blue: #0a4695;
  --blue-mid: #0862aa;
  --blue-bright: #0aa0dc;
  --blue-soft: #eaf2fb;
  --blue-line: #cfe0f2;
  --blue-grad: linear-gradient(135deg, #0e0d6a 0%, #0a4695 45%, #0862aa 68%, #01b6ec 100%);
  /* 上バーの配色。青を保ったまま、右下へ向かって白へ抜ける。
     白のにじみは中心を右下の外へ置いてあるので、上端の色には触れない */
  --bar-glow: radial-gradient(135% 220% at 104% 142%,
    rgba(255, 255, 255, .82) 0%,
    rgba(150, 226, 250, .52) 28%,
    rgba(1, 182, 236, 0) 64%);
  /* 画面上端に接する色。theme-color と html の背景もこれに合わせること */
  --safe-top: #0a4695;
  --ink: #1a1a1f;
  --sub: #45454d;
  --mut: #6b6b73;
  --line: #e5e5ea;
  --soft: #f6f7f9;
  --gold: #f0b21f;
  --gold-deep: #8a5a00;
  --gold-soft: #fdf3d2;
  --bg: var(--soft);
  --panel: #ffffff;
  --ink-soft: var(--sub);
  --ink-faint: var(--mut);
  --accent: var(--blue);
  --accent-soft: var(--blue-soft);
  --star: var(--gold);
  --chip: #f0f3f7;
  --shadow: 0 1px 6px rgba(26, 26, 31, .04), 0 12px 30px rgba(14, 13, 106, .10);
  --toggle: 2.75rem;
  /* Dynamic Island / ステータスバーの高さ。env() を直に書かず変数へ通しておくと、
     PCのブラウザでも値を差し込んで iPhone の見え方を再現できる（検証用） */
  --safe-top-inset: env(safe-area-inset-top, 0px);
  /* 上のバーと一覧カードで共有する左右の余白。ここ1か所だけを直せば全部そろう */
  --gutter: clamp(1.15rem, 3vw, 2.75rem);
  --repository-deep: linear-gradient(90deg, #0e0d6a, #0a4695);
  --repository-mid: linear-gradient(90deg, #0a4695, #0862aa);
  --repository-bright: linear-gradient(90deg, #0862aa, #01b6ec);
  --repository-soft: linear-gradient(90deg, #7db8df, #cfe0f2);
}
* { box-sizing: border-box; }
html, body { height: 100%; background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  font-size: 15px;
  -webkit-text-size-adjust: 100%;
}
.app { display: flex; height: 100%; }
main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
iframe { flex: 1; width: 100%; border: 0; background: var(--panel); }

/* ── トップ（ページ未選択）───────────────────────── */
#home {
  flex: 1; display: none; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
#home.on { display: block; animation: home-in .2s ease both; }
@keyframes home-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* ── 上のバー。名前・件数・検索・承認依頼・更新を1行に収める ─────
   スクロールしても留まるので、下まで読んでから検索やトップへ戻れる */
.topbar {
  position: sticky; top: 0; z-index: 12;
  /* セーフエリアぶんも自分の背景で塗る。ここを本文側へ押し出すと、上端だけ
     別の色（html の背景）が覗いて継ぎはぎになる */
  padding-top: var(--safe-top-inset);
  color: #fff;
  /* PCは横に長いので斜めのまま。右下へ向かって白へ抜ける */
  background:
    var(--bar-glow),
    linear-gradient(115deg, #0e0d6a 0%, #0a4695 40%, #0862aa 70%, #0aa0dc 100%);
  box-shadow: 0 6px 20px rgba(14, 13, 106, .16);
}
.topbar-inner {
  height: 3.4rem;
  padding-right: max(var(--gutter), env(safe-area-inset-right));
  padding-left: max(var(--gutter), env(safe-area-inset-left));
  display: flex; align-items: center; gap: .55rem;
}
.brand {
  flex: none;
  margin-left: -.5rem; padding: .35rem .55rem;
  display: inline-flex; align-items: center; gap: .45rem;
  border: 0; border-radius: .6rem; background: transparent; color: #fff;
  font: inherit; font-size: .95rem; font-weight: 700; letter-spacing: .04em;
  cursor: pointer; transition: background .16s ease;
}
.brand:hover { background: rgba(255, 255, 255, .16); }
.brand:active { background: rgba(255, 255, 255, .24); }
.brand svg {
  width: 1.1rem; height: 1.1rem; flex: none;
  fill: none; stroke: currentColor; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round; opacity: .85;
}
.brand-meta {
  /* 更新時刻だけを、右のアイコンの手前に小さく添える。右の細い線でアイコンと区切る */
  flex: none; margin-right: .5rem; padding-right: .7rem;
  border-right: 1px solid rgba(255, 255, 255, .22);
  font-size: .7rem; font-weight: 500; letter-spacing: .04em;
  color: rgba(255, 255, 255, .62); font-variant-numeric: tabular-nums; white-space: nowrap;
}
body.searching .brand-meta { display: none; }
.topbar-actions { flex: none; margin-left: auto; margin-right: -.45rem; display: flex; align-items: center; gap: .15rem; }

/* 右上の道具はアイコンだけにする。枠線つきの丸ボタンの真下に絞り込みチップが並ぶと、
   同じ形の部品が縦横に詰まってごちゃつくので、枠も面も外して記号だけにし、
   触れたときだけ淡く光らせる。形の役割を「右上＝道具」「2段目＝絞り込み」に分ける。
   文字ラベルは PC でも出さない（名前は title / aria-label に残す） */
.tb-btn {
  width: 2.4rem; height: 2.4rem; padding: 0;
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
  border: 1px solid transparent; border-radius: 999px;
  background: transparent; color: #fff;
  font: inherit; font-size: .78rem; white-space: nowrap; cursor: pointer;
  transition: background .18s ease, border-color .18s ease;
}
.tb-btn:hover { background: rgba(255, 255, 255, .16); }
.tb-btn:active { transform: scale(.97); }
.tb-btn .label { display: none; }
.tb-btn svg {
  width: 1.15rem; height: 1.15rem; flex: none;
  fill: none; stroke: currentColor; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round;
}
body.refreshing #refresh svg { animation: refresh-spin .65s linear infinite; }
@keyframes refresh-spin { to { transform: rotate(360deg); } }

/* インボックスに取り込み待ちが残っているときだけ点ける印。件数は出さない——
   用があるかどうかさえ分かれば、開いた先に中身が並んでいる。
   基準はボタンではなくアイコン。ラベルは説明文であって対象ではないので、
   印は対象を表すシンボルの肩へ乗せる（タブバーのバッジと同じ作法）。
   こうしておくと、スマホ幅でラベルが消えても位置関係が変わらない */
.tb-ico { position: relative; flex: none; display: inline-flex; }
.tb-dot {
  position: absolute; top: -.16rem; right: -.2rem;
  width: .44rem; height: .44rem; border-radius: 50%;
  background: var(--gold);
  /* ふちは点を背景から起こすためだけのもの。太くすると二重丸に見えて印が鈍る */
  box-shadow: 0 0 0 .07rem rgba(14, 13, 106, .5);
}

/* ── 検索。ふだんは虫めがねだけ、押すと横へ伸びて入力欄になる ───── */
.search {
  position: relative; flex: none;
  width: 2.4rem; height: 2.4rem; overflow: hidden;
  display: flex; align-items: center;
  border: 1px solid transparent; border-radius: 999px;
  background: transparent;
  transition: width .26s cubic-bezier(.4, 0, .2, 1), background .18s ease, border-color .18s ease;
}
.search:hover { background: rgba(255, 255, 255, .16); }
/* 入力欄の面は、検索を開いたときだけ出す */
body.searching .search {
  width: min(17rem, 40vw);
  background: rgba(255, 255, 255, .2);
}
#search-toggle {
  flex: none; width: 2.35rem; height: 2.35rem;
  display: flex; align-items: center; justify-content: center;
  border: 0; background: transparent; color: #fff;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
#search-toggle svg {
  width: 1.15rem; height: 1.15rem;
  fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round;
}
#q {
  flex: 1; min-width: 0; height: 100%; padding: 0;
  border: 0; background: transparent; color: #fff;
  /* ⚠️ 16px を下回らせない。iOS Safari は 16px 未満の入力欄にフォーカスすると
     ページごと拡大し、横幅が画面からはみ出したまま戻らない（ピンチ操作が要る）。
     バーの中では大きく見えるが、小ささは幅と padding で作る */
  font: inherit; font-size: 16px;
  opacity: 0; transition: opacity .16s ease;
}
body.searching #q { opacity: 1; }
#q::placeholder { color: rgba(255, 255, 255, .6); }
#q:focus { outline: 0; }
#q::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
#search-clear {
  flex: none; width: 1.9rem; height: 100%;
  display: none; align-items: center; justify-content: center;
  border: 0; background: transparent; color: rgba(255, 255, 255, .8);
  font: inherit; font-size: 1rem; line-height: 1; cursor: pointer;
}
body.searching.has-query #search-clear { display: flex; }
#search-clear:hover { color: #fff; }

.home-content { padding: 1.5rem var(--gutter) calc(3rem + env(safe-area-inset-bottom)); }

/* ── 日付の区切り。テーマは「そのテーマの最終更新日」でどの区切りに入るかが決まる ── */
.dgroup { margin-bottom: 2.5rem; }
.dgroup:last-child { margin-bottom: 0; }
.dhead {
  /* 日付の見出しも、下に並ぶカードと左右の端をそろえる */
  display: flex; align-items: baseline; gap: .75rem; margin: 0 0 .9rem;
  font-size: .75rem; font-weight: 700; letter-spacing: .12em;
  color: var(--blue);
}
.dhead::after { content: ""; flex: 1; height: 1px; background: var(--blue-line); opacity: .7; }
.dcount { order: 3; font-weight: 500; letter-spacing: .02em; color: var(--mut); }

/* 高さのばらつく塊を隙間なく詰めるための多段組み。段数ではなく列幅で指定して
   いるので、画面幅にそのまま追従する。Grid だと行の高さが一番大きい塊に
   引っ張られて隙間だらけになるため、こちらを選んでいる */
.dbody { columns: 23rem 3; column-gap: 1.25rem; }

/* ── テーマの塊。同じ案件のページを 1 枚にまとめて縦の消費を抑える ── */
.theme, .solo {
  margin-bottom: 1.25rem; padding: .35rem 0;
  border: 1px solid rgba(14, 13, 106, .06); border-radius: 1rem;
  background: var(--panel);
  box-shadow: 0 1px 2px rgba(26, 26, 31, .03), 0 10px 26px rgba(14, 13, 106, .055);
  break-inside: avoid; -webkit-column-break-inside: avoid;
}
.th { display: flex; align-items: center; gap: .55rem; padding: .7rem 1.05rem .55rem; }
.tname { min-width: 0; font-size: .9rem; font-weight: 700; letter-spacing: .01em; color: var(--blue-deep); }
/* 更新時刻は各行に出ているので見出しには置かない。件数は折り返さず右へ寄せる */
.tcount { margin-left: auto; font-size: .72rem; color: var(--mut); white-space: nowrap; }
.th > .star {
  flex: none; width: 2rem; height: 2rem; margin: -.35rem -.45rem -.35rem -.1rem;
  font-size: 1rem;
}

/* ── 1 行 1 ページ。タイトル・更新時刻・スターだけに絞る ── */
.row-wrap { position: relative; }
.row-wrap + .row-wrap::before {
  content: ""; position: absolute; left: 1.7rem; right: .7rem; top: 0;
  height: 1px; background: #f0f0f4;
}
.row {
  display: flex; align-items: center; gap: .6rem;
  width: calc(100% - .7rem); margin: 0 .35rem;
  padding: .5rem 2.5rem .5rem 1.05rem;
  border: 0; border-radius: .55rem; background: transparent;
  color: inherit; font: inherit; text-decoration: none; text-align: left; cursor: pointer;
  transition: background .12s ease;
}
.row.in { padding-left: 1.35rem; }
.row-wrap.in + .row-wrap.in::before { left: 2rem; }
.row-wrap:hover .row { background: #f4f7fc; }
/* 隣り合う行の境界線は、どちらかに触れている間だけ消す（塗りと線を重ねない） */
.row-wrap:hover::before,
.row-wrap:hover + .row-wrap::before { background: transparent; }
.row .dot { flex: none; width: .4rem; height: .4rem; border-radius: 50%; background: transparent; }
.row .dot.on { background: var(--blue-bright); box-shadow: 0 0 0 3px rgba(10, 160, 220, .15); }
.row .t {
  flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: .875rem; line-height: 1.5; color: var(--sub);
}
/* 新着は色だけでなく太さでも示す */
.row .dot.on ~ .t { font-weight: 650; color: var(--ink); }
.row .sh { flex: none; font-size: .7rem; opacity: .75; }
.row time {
  flex: none; font-size: .71rem; letter-spacing: .01em; color: var(--mut);
  font-variant-numeric: tabular-nums;
}
.row-wrap > .star {
  position: absolute; top: 50%; right: .5rem; transform: translateY(-50%);
  width: 1.9rem; height: 1.9rem; font-size: .95rem;
}
.row-wrap > .star:active { transform: translateY(-50%) scale(.82); }
/* 読み終えた行に空の☆が並ぶと視覚ノイズになるので、マウスのある環境では触れたときだけ出す。
   指で操作する環境ではこの規則が効かず、従来どおり常に見える */
@media (hover: hover) {
  .row-wrap > .star:not(.on) { opacity: 0; transition: opacity .12s ease; }
  .row-wrap:hover > .star:not(.on),
  .row-wrap > .star:focus-visible { opacity: 1; }
}
.row-wrap > .restore {
  position: absolute; top: 50%; right: .5rem; transform: translateY(-50%);
  min-height: 1.9rem; padding: 0 .6rem;
  border: 0; border-radius: .5rem; background: var(--blue-soft); color: var(--blue);
  font: inherit; font-size: .7rem; font-weight: 600; cursor: pointer;
}
/* 「戻す」は☆より横幅を食うので、その分だけ行の右を広く空ける */
.row.off { padding-right: 4.3rem; cursor: default; }
.row-wrap:has(.row.off):hover .row { background: transparent; }
.more {
  display: block; width: calc(100% - .7rem); margin: .15rem .35rem 0;
  padding: .5rem 1.05rem .55rem 1.35rem;
  border: 0; border-radius: .55rem; background: transparent;
  color: var(--blue); font: inherit; font-size: .76rem;
  text-align: left; cursor: pointer;
}
.more:hover { background: #f4f7fc; }

/* ── 絞り込みチップ。ヘッダーの帯の2段目に、すべて／スター／進行中の仕事を横に並べる ──
   一覧のカードと同じ見た目にすると「読むもの」と「切り替えるもの」の区別が消えるので、
   一覧の中ではなくヘッダーへ置く。スクロールしてもヘッダーごと残る */
.chips {
  display: flex; flex-wrap: wrap; gap: .5rem;
  padding: .15rem max(var(--gutter), env(safe-area-inset-right)) .85rem max(var(--gutter), env(safe-area-inset-left));
}
.chips:empty { display: none; }
body.searching .chips { display: none; }
.chip {
  flex: none; height: 2rem; padding: 0 .8rem;
  display: inline-flex; align-items: center; gap: .4rem;
  /* 枠線は持たせず面だけにする。右上の道具（記号だけ）と形で見分けられるように */
  border: 0; border-radius: 999px;
  background: rgba(255, 255, 255, .14); color: #fff;
  font: inherit; font-size: .78rem; font-weight: 650; white-space: nowrap;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: background .16s ease, border-color .16s ease, color .16s ease;
}
.chip:hover { background: rgba(255, 255, 255, .24); }
.chip .n { font-size: .68rem; font-weight: 600; opacity: .78; font-variant-numeric: tabular-nums; }
.chip .n.soon { color: #ffe08a; opacity: 1; }
.chip.on { background: #fff; color: var(--blue-deep); box-shadow: 0 2px 10px rgba(14, 13, 106, .18); }
.chip.on .n { color: var(--mut); opacity: 1; }
.chip.on .n.soon { color: var(--gold-deep); }
.chip .x {
  margin: 0 -.45rem 0 .05rem; width: 1.35rem; height: 1.35rem;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%; color: var(--mut); font-size: .8rem; line-height: 1;
}
.chip .x:hover { background: var(--blue-soft); color: var(--blue); }
.chip.link .n::after { content: " ↗"; }
/* ── 進行中の足し引き。鉛筆 → 編集中は全チップに ✕、並びの最後に「＋ 追加」と「完了」 ── */
.chip.ghost { background: transparent; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .32); }
.chip.ghost:hover { background: rgba(255, 255, 255, .14); }
.chip.ghost.on { background: #fff; color: var(--blue-deep); box-shadow: none; }
.chip.edit { width: 2rem; padding: 0; justify-content: center; }
.chip.edit.on { width: auto; padding: 0 .85rem; }
.chip.edit svg { width: .95rem; height: .95rem; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.chip:not(.on) .x { color: rgba(255, 255, 255, .8); }
.chip:not(.on) .x:hover { background: rgba(255, 255, 255, .2); color: #fff; }
/* 「＋ 追加」で開く候補。上バーの中、チップの列の下に白い面で出す */
.chip-picker {
  margin: 0 max(var(--gutter), env(safe-area-inset-right)) .85rem max(var(--gutter), env(safe-area-inset-left));
  padding: .8rem .9rem .9rem; border-radius: 1rem; background: #fff; color: var(--ink);
  box-shadow: 0 12px 32px rgba(14, 13, 106, .22);
  max-height: 50vh; overflow-y: auto;
}
.chip-picker[hidden] { display: none; }
body.searching .chip-picker { display: none; }
.picker-head { margin: 0 0 .55rem; font-size: .72rem; font-weight: 700; letter-spacing: .08em; color: var(--mut); }
.picker-list { display: flex; flex-wrap: wrap; gap: .4rem; }
.picker-item {
  display: inline-flex; align-items: center; gap: .45rem; height: 2rem; padding: 0 .8rem;
  max-width: 100%; min-width: 0;
  border: 0; border-radius: 999px; background: var(--blue-soft); color: var(--blue-deep);
  font: inherit; font-size: .78rem; font-weight: 650; cursor: pointer; white-space: nowrap;
}
.picker-item:hover { background: #dbe8f7; }
.picker-item::before { content: "＋"; color: var(--blue); font-weight: 700; }
.picker-item > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.picker-item .n { flex: none; font-size: .68rem; font-weight: 500; color: var(--mut); }
.picker-empty { margin: 0; font-size: .78rem; color: var(--mut); }
/* 絞り込み中にだけ出す1行。何で絞っているか・締切・メモを本文の先頭で示す */
.filter-note {
  margin: 1.1rem var(--gutter) -.4rem; font-size: .8rem; color: var(--sub);
  overflow-wrap: anywhere;
}
.filter-note b { color: var(--blue-deep); }

.empty { padding: 4rem 0; text-align: center; color: var(--mut); font-size: .85rem; }

/* 削除済みは常設の入口を持たせず、一覧の末尾へ控えめに置く */
.trash-bar { margin-top: 2.25rem; display: flex; justify-content: center; }
#trash-toggle {
  min-height: 2.1rem; padding: 0 .9rem;
  display: none; align-items: center; gap: .4rem;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--panel); color: var(--ink-faint);
  font: inherit; font-size: .72rem; cursor: pointer;
  transition: color .16s ease, border-color .16s ease;
}
#trash-toggle.on { display: inline-flex; }
#trash-toggle:hover { color: var(--ink); border-color: var(--blue-line); }

/* ── ページ表示中の操作。左にホーム、右にメニューの2つだけ ───────── */
#home-btn, #page-actions {
  position: fixed;
  top: calc(.45rem + var(--safe-top-inset));
  z-index: 30;
  display: none;
  transition: transform .24s ease, opacity .18s ease;
}
#home-btn { left: .55rem; }
#page-actions { right: .55rem; }
body.page-open #home-btn { display: flex; }
body.page-open #page-actions { display: block; }
#home-btn, #page-more {
  width: var(--toggle); height: var(--toggle); padding: 0;
  align-items: center; justify-content: center;
  border: 1px solid rgba(255, 255, 255, .62); border-radius: 1rem;
  background: rgba(255, 255, 255, .78); color: var(--ink-soft);
  font: inherit; cursor: pointer; box-shadow: var(--shadow);
  backdrop-filter: blur(22px) saturate(180%); -webkit-backdrop-filter: blur(22px) saturate(180%);
}
#page-more { display: flex; }
#home-btn:hover, #page-more:hover { background: var(--panel); color: var(--ink); }
#home-btn svg { width: 1.2rem; height: 1.2rem; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#page-more svg { width: 1.15rem; height: 1.15rem; fill: currentColor; }
#page-popover-dismiss {
  position: fixed; inset: 0; z-index: 29;
  background: transparent;
}
#page-menu,
#page-share-panel,
#page-share-toast {
  position: absolute; top: calc(100% + .45rem); right: 0;
  border: 1px solid rgba(28, 35, 51, .10); border-radius: 1rem;
  background: rgba(255, 255, 255, .92); box-shadow: var(--shadow);
  backdrop-filter: blur(26px) saturate(180%); -webkit-backdrop-filter: blur(26px) saturate(180%);
}
#page-menu[hidden], #page-share-panel[hidden], #page-share-toast[hidden] { display: none; }
#page-menu { width: 15rem; padding: .38rem; }
#page-share-toast {
  width: min(18rem, calc(100vw - 1.1rem));
  padding: .7rem .85rem;
  color: var(--ink); font-size: .82rem; line-height: 1.4;
}
#page-share-toast strong { display: block; font-weight: 650; }
#page-share-toast .toast-meta {
  display: block; margin-top: .15rem;
  color: var(--mut); font-size: .72rem; font-weight: 400;
}
.page-action {
  width: 100%; min-height: 2.75rem; padding: .55rem .7rem;
  display: flex; align-items: center; gap: .7rem;
  border: 0; border-radius: .72rem; background: transparent; color: var(--ink);
  font: inherit; text-align: left; cursor: pointer;
}
.page-action + .page-action { border-top: 1px solid rgba(229, 229, 234, .72); border-radius: 0; }
.page-action:hover { background: rgba(10, 70, 149, .07); }
.page-action svg { width: 1.05rem; height: 1.05rem; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.page-action.starred { color: var(--gold-deep); }
.page-action.starred svg { fill: currentColor; }
.page-action:disabled { opacity: .5; }
.page-action.delete { color: #d92d20; }
#page-share-panel {
  width: min(21rem, calc(100vw - 1.1rem)); padding: .75rem;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .8fr); gap: .55rem;
}
#page-share-panel label { display: grid; gap: .25rem; color: var(--mut); font-size: .68rem; }
#page-share-panel select,
#page-share-issue {
  min-width: 0; min-height: 2.4rem; padding: .4rem .55rem;
  border: 1px solid var(--line); border-radius: .6rem; background: #f6f7f9; color: var(--ink);
  /* ⚠️ font: inherit だけだと上の label の .68rem を継承して 10.9px になり、
     iOS Safari が拡大する。ラベルは小さいまま、入力欄だけ 16px で止める */
  font: inherit; font-size: 16px;
}
#page-share-issue {
  grid-column: 1 / -1; border-color: var(--blue); background: var(--blue); color: #fff;
  font-weight: 600; cursor: pointer;
}
#page-share-issue:disabled { opacity: .72; }
body.page-controls-hidden #home-btn,
body.page-controls-hidden #page-actions {
  transform: translateY(-5rem); opacity: 0; pointer-events: none;
}

/* ── スマホ ───────────────────────────────────── */
@media (max-width: 46rem) {
  /* スマホはチップを折り返さず横へ流す。ヘッダーが何段にも伸びると本文が押し下がる */
  .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .chips::-webkit-scrollbar { display: none; }
  html,
  body {
    min-height: 100%;
    background: var(--safe-top);
    overflow-x: clip;
    overscroll-behavior-x: none;
  }
  body:not(.page-open) {
    height: auto;
    min-height: 100dvh;
  }
  body.page-open {
    height: 100%;
    min-height: 0;
  }
  body.page-open .app {
    height: 100%;
    min-height: 0;
  }
  body:not(.page-open) .app {
    height: auto;
    min-height: 100dvh;
    background: var(--bg);
  }
  body:not(.page-open) main {
    min-height: 100dvh;
    background: var(--bg);
  }
  body:not(.page-open) #home {
    flex: none;
    overflow-y: visible;
    background: var(--bg);
  }
  /* Dynamic Island の周りは、幅いっぱい同じ色にする。
     上端に接する色は theme-color・html の背景・PWAのステータスバーからも決まるが、
     どれも単色しか置けない。一方 135deg の斜めグラデを高さ110pxの細い帯へ敷くと、
     上端だけで色が左端から右端まで一気に進む（左は濃紺・右は水色）。
     この「左右で変わる上端」と「単色しか置けない外側」は原理的に一致しないので、
     継ぎはぎに見える。だから縦方向のグラデへ組み替え、斜めのニュアンスは
     上端まで届かない放射グラデ（右下が中心）で足している。
     上端を濃紺で覆ってフェードさせる手も試したが、覆いとグラデの境目が帯に見えた。 */
  .topbar {
    background:
      var(--bar-glow),
      linear-gradient(
        to bottom,
        var(--safe-top) 0,
        var(--safe-top) calc(var(--safe-top-inset) + .2rem),
        /* ⚠️ 中間点を % で置かない。% はバー全体（セーフエリア込み）に対する割合なので、
           ホーム画面Webアプリのように上端の余白が59pxある状態では、単色の終わり(.2rem)と
           58%がほぼ重なり、2pxで色が急変して「Dynamic Islandだけ別の島」に見える。
           Safariのタブは余白が小さいので再現せず、PWAでだけ出る（2026-08-13 実機で再現）。
           セーフエリアの下から測った実寸で置けば、どちらでも同じなだらかさになる */
        #0862aa calc(var(--safe-top-inset) + 2.4rem),
        /* 終点はチップの段の下まで延ばす。上の段の高さで水色へ抜けると、
           白文字のチップが明るい地に沈んで読みにくくなる */
        #0a86c8 calc(var(--safe-top-inset) + 6.2rem)
      );
  }
  .topbar-inner { height: 3.2rem; gap: .5rem; }
  /* 画面が狭いので、件数の表示は検索・承認依頼の場所を奪わない範囲でだけ出す */
  .brand-meta { display: none; }
  /* 検索中はロゴを畳んで、入力欄に残り幅を全部渡す */
  body.searching .brand { padding-right: .3rem; padding-left: .3rem; }
  body.searching .brand .label { display: none; }
  body.searching .search { width: auto; flex: 1; }
  body.searching .topbar-actions { flex: 1; }
  .home-content {
    padding-top: 1.1rem;
    padding-right: max(1rem, env(safe-area-inset-right, 0px));
    padding-left: max(1rem, env(safe-area-inset-left, 0px));
  }
  .dgroup { margin-bottom: 1.9rem; }
  .theme, .solo { margin-bottom: .9rem; border-radius: .9rem; }
  .th { padding: .65rem .85rem .5rem; }
  .row { padding: .58rem 2.4rem .58rem .85rem; }
  .row.in { padding-left: 1.15rem; }
  .row-wrap + .row-wrap::before { left: 1.5rem; }
  .row-wrap.in + .row-wrap.in::before { left: 1.8rem; }
  /* 行に「タイトル＋時刻＋★」が入る最小幅を切ると読めなくなるので 1 段で固定する */
  .dbody { columns: 1; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
  }
}
@media (prefers-reduced-transparency: reduce) {
  #home-btn, #page-more, #page-menu, #page-share-panel, #page-share-toast {
    background: #fff; backdrop-filter: none; -webkit-backdrop-filter: none;
  }
}
@media (max-width: 46rem) {
  /* 鉛筆はチップの列の右端に貼り付け、横へ流さなくても押せるようにする */
  .chips { padding-right: 0; }
  .chip.edit {
    position: sticky; right: 0; margin-left: auto;
    background: #0a7cc0;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .32), -.9rem 0 .8rem .1rem #0a7cc0;
  }
  .chips > .chip:last-child { margin-right: max(var(--gutter), env(safe-area-inset-right)); }
  /* 編集中は全部を見せたいので、横に流さず折り返す */
  .chips.editing { flex-wrap: wrap; overflow: visible; padding-right: max(var(--gutter), env(safe-area-inset-right)); }
  .chips.editing > .chip:last-child { margin-right: 0; }
  .chips.editing .chip.edit { position: static; background: #fff; box-shadow: none; }
}

/* 「完了」はチップに見せない。塗りも枠も持たない文字ボタンにして、選択中の白いチップと区別する。
   開いている「＋ 追加」も白く塗らず、枠を明るくするだけにする */
.chip.edit.on {
  width: auto; padding: 0 .55rem 0 .7rem; gap: .3rem;
  background: transparent; box-shadow: none; color: #fff; font-weight: 700;
}
.chip.edit.on:hover { background: rgba(255, 255, 255, .14); }
.chip.edit.on svg { stroke-width: 2.4; }
.chip.ghost:not(.edit).on {
  background: rgba(255, 255, 255, .22); color: #fff;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .7);
}
@media (max-width: 46rem) {
  .chips.editing .chip.edit { background: transparent; box-shadow: none; }
}

/* カード見出しの「進行中へ入れる」。☆ と同じ寸法で左に並べる */
.shelf-pin {
  flex: none; width: 2rem; height: 2rem; margin: -.35rem -.3rem -.35rem .1rem;
  display: inline-flex; align-items: center; justify-content: center;
  border: 0; border-radius: 50%; background: transparent; color: var(--mut); cursor: pointer;
  transition: background .12s ease, color .12s ease;
}
.shelf-pin:hover { background: var(--blue-soft); color: var(--blue); }
.shelf-pin svg { width: 1.15rem; height: 1.15rem; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.shelf-pin.on { color: var(--blue); }
.shelf-pin.on .fill { fill: var(--blue); stroke: var(--blue); }
.shelf-pin.on .mark { stroke: #fff; stroke-width: 2; }
</style>
</head>
<body>
<div class="app">
  <main>
    <iframe id="frame" title="選択中のページ" hidden></iframe>
    <div id="home" class="on">
      <header class="topbar">
        <div class="topbar-inner">
          <button class="brand" id="brand" type="button" title="トップへ戻る">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.2 12 4.5l8 6.7M6.4 9.6V19h11.2V9.6"/></svg>
            <span class="label">HTML共有くん</span>
          </button>
          <div class="topbar-actions">
            <span class="brand-meta" id="brand-meta"></span>
            <div class="search" id="search">
              <button id="search-toggle" type="button" aria-label="検索する" aria-expanded="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.4" fill="none"/><path d="m20 20-4.2-4.2"/></svg>
              </button>
              <input id="q" type="search" placeholder="タイトル・リポジトリで絞り込み" autocomplete="off" tabindex="-1">
              <button id="search-clear" type="button" aria-label="検索語を消す">×</button>
            </div>
            <button class="tb-btn" id="review" type="button" aria-label="インボックス" title="インボックス">
              <span class="tb-ico">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h4l1.4 2.4h5.2L16 13h4M4 13l2.6-7h10.8L20 13v5H4z"/></svg>
                <span class="tb-dot" id="review-dot" hidden></span>
              </span>
              <span class="label">インボックス</span>
            </button>
            <button class="tb-btn icon" id="refresh" type="button" aria-label="一覧を更新" title="一覧を更新">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5M19 11a7 7 0 1 0 .2 5"/></svg>
            </button>
          </div>
        </div>
        <nav class="chips" id="chips" aria-label="一覧の絞り込み"></nav>
        <div class="chip-picker" id="chip-picker" hidden></div>
      </header>
      <p class="filter-note" id="filter-note" hidden></p>
      <div class="home-content">
        <div id="tiles"></div>
        <div class="trash-bar">
          <button id="trash-toggle" type="button"><span id="trash-label"></span></button>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="page-popover-dismiss" hidden></div>
<button id="home-btn" type="button" aria-label="トップへ戻る" title="トップへ戻る">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.2 12 4.5l8 6.7M6.4 9.6V19h11.2V9.6"/></svg>
</button>
<div id="page-actions">
  <button id="page-more" type="button" aria-label="ページ操作を開く" aria-haspopup="menu" aria-expanded="false" aria-controls="page-menu">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
  </button>
  <div id="page-menu" role="menu" aria-label="ページ操作" hidden>
    <button class="page-action" id="page-star" type="button" role="menuitem" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg><span>スターを付ける</span>
    </button>
    <button class="page-action" id="page-unread" type="button" role="menuitem" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5h17v11h-17zM3.5 7.5 12 14l8.5-6.5"/></svg><span>未読に戻す</span>
    </button>
    <button class="page-action" id="page-refresh" type="button" role="menuitem">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5M19 11a7 7 0 1 0 .2 5"/></svg><span>更新</span>
    </button>
    <button class="page-action" id="page-share" type="button" role="menuitem">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M8 8l4-4 4 4M5 13v6h14v-6"/></svg><span>共有URLを発行</span>
    </button>
    <button class="page-action delete" id="page-delete" type="button" role="menuitem">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg><span>一覧から削除</span>
    </button>
  </div>
  <div id="page-share-panel" aria-label="共有URLの発行" hidden>
    <label>公開範囲<select id="page-share-scope"><option value="i">社内限定</option><option value="p">IP制限なし</option></select></label>
    <label>有効日数<select id="page-share-days"><option>1</option><option>3</option><option selected>7</option><option>14</option><option>30</option><option>90</option></select></label>
    <button id="page-share-issue" type="button">発行してコピー</button>
  </div>
  <div id="page-share-toast" role="status" hidden>
    <strong>コピーしました</strong>
    <span class="toast-meta"></span>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const frame = $('frame'), home = $('home'), tilesEl = $('tiles'), brandMeta = $('brand-meta');
  const searchBox = $('search'), searchToggle = $('search-toggle'), searchClear = $('search-clear');
  const refresh = $('refresh'), pageRefresh = $('page-refresh');
  const pageMore = $('page-more'), pageMenu = $('page-menu'), pageSharePanel = $('page-share-panel');
  const pageShareToast = $('page-share-toast'), pagePopoverDismiss = $('page-popover-dismiss');
  const pageStar = $('page-star'), pageUnread = $('page-unread'), pageShare = $('page-share'), pageDelete = $('page-delete'), pageShareIssue = $('page-share-issue');
  let shareToastTimer = 0;
  const trashToggle = $('trash-toggle'), trashLabel = $('trash-label');
  const STAR_KEY = 'mb_starred_pages';
  const STREAM_STAR_PREFIX = '@stream:';
  const HIDDEN_KEY = 'mb_hidden_pages';
  const READ_KEY = 'mb_read_marks';
  const SHELF_DONE_KEY = 'mb_shelf_done';
  const SHELF_ADDED_KEY = 'mb_shelf_added';
  const CAN_SYNC = location.protocol === 'https:';
  let allPages = [], pages = [], current = null, meta = null;
  let starred = new Set();
  let hiddenSources = new Set();
  // 進行中の棚から ✓ で下ろした項目の id。棚の台帳（設定ファイル）は書き換えず、本人設定として同期する
  let shelfDone = new Set();
  // 本人がチップの「＋ 追加」で進行中へ足したテーマのキー（足した順）
  let shelfAdded = [];
  let chipEditing = false;
  let chipPicking = false;
  // 棚の行を押して絞り込み中のテーマキー。もう一度押すと解除する
  let shelfFilter = null;
  // { ページの source: 開いたときの更新日時 }。更新日時ごと持つので、再更新で自動的に未読へ戻る
  let readMarks = {};
  let knowsReadMarks = false;
  let showingTrash = false;
  let filterText = '';
  let preferenceSaveTimer = null;
  // テーマ内で最初に見せる件数と、「他N件を表示」で開いたテーマのキー
  const STREAM_PREVIEW = 4;
  const expandedStreams = new Set();

  try {
    const saved = JSON.parse(localStorage.getItem(STAR_KEY) ?? '[]');
    if (Array.isArray(saved)) starred = new Set(saved.filter((item) => typeof item === 'string'));
  } catch { /* 壊れた保存値は空として扱う */ }
  try {
    const saved = JSON.parse(localStorage.getItem(HIDDEN_KEY) ?? '[]');
    if (Array.isArray(saved)) hiddenSources = new Set(saved.filter((item) => typeof item === 'string'));
  } catch { /* 壊れた保存値は空として扱う */ }
  try {
    const saved = JSON.parse(localStorage.getItem(SHELF_DONE_KEY) ?? '[]');
    if (Array.isArray(saved)) shelfDone = new Set(saved.filter((item) => typeof item === 'string'));
  } catch { /* 壊れた保存値は空として扱う */ }
  try {
    const saved = JSON.parse(localStorage.getItem(SHELF_ADDED_KEY) ?? '[]');
    if (Array.isArray(saved)) shelfAdded = saved.filter((item) => typeof item === 'string');
  } catch { /* 壊れた保存値は空として扱う */ }
  try {
    const raw = localStorage.getItem(READ_KEY);
    const saved = raw === null ? null : JSON.parse(raw);
    if (saved && typeof saved === 'object' && !Array.isArray(saved)) {
      readMarks = saved;
      knowsReadMarks = true;
    }
  } catch { /* 壊れた保存値は未記録として扱う */ }

  // 日付の区切り・新着判定・☆は page-list.js が正本。ここでは委譲するだけにする。
  // 行の見た目だけはトップ専用（1行1ページ）なので、この画面側で組み立てる
  const L = window.MyBriefsList;
  const fmtDateTime = L.fmtDateTime;
  const dateGroup = L.dateGroup;
  const shortTime = L.shortTime;

  const isNarrow = () => matchMedia('(max-width: 46rem)').matches;
  const isStarred = (page) => starred.has(page.source);
  // 一度も開いていない、または開いたあとに元HTMLが更新されたページ
  const isUnread = (page) => L.isUnread(page, readMarks);
  const isNew = (page) => L.isNew(page, readMarks);
  const pageRepository = L.pageRepository;
  const pageStream = (page) => page.stream ?? pageRepository(page);
  const pageStreamLabel = (page) => page.streamLabel ?? pageStream(page);
  const streamStarId = (streamKey) => `${STREAM_STAR_PREFIX}${streamKey}`;
  const isStreamStarValue = (value) => value.startsWith(STREAM_STAR_PREFIX);

  function isValidStarValue(value, validSources, validStreams) {
    if (validSources.has(value)) return true;
    return isStreamStarValue(value) && validStreams.has(value.slice(STREAM_STAR_PREFIX.length));
  }

  function saveLocalPreferences() {
    try {
      localStorage.setItem(STAR_KEY, JSON.stringify([...starred]));
      localStorage.removeItem('mb_recent_pages');
      localStorage.setItem(HIDDEN_KEY, JSON.stringify([...hiddenSources]));
      localStorage.setItem(READ_KEY, JSON.stringify(readMarks));
      localStorage.setItem(SHELF_DONE_KEY, JSON.stringify([...shelfDone]));
      localStorage.setItem(SHELF_ADDED_KEY, JSON.stringify(shelfAdded));
      knowsReadMarks = true;
    } catch { /* noop */ }
  }

  /** そのページを「今の版で読んだ」ことにする。次に元HTMLが更新されれば再び新着に戻る */
  function markRead(page) {
    if (!L.markRead(page, readMarks)) return false;
    queuePreferenceSave();
    return true;
  }

  /** ページ操作メニューの「未読に戻す」。あとで読み直したいページを新着へ戻す */
  function markUnread(page) {
    if (!L.markUnread(page, readMarks)) return false;
    queuePreferenceSave();
    return true;
  }

  async function sha256(value) {
    const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(value));
    return [...new Uint8Array(hash)].map((byte) => byte.toString(16).padStart(2, '0')).join('');
  }

  async function preferencesApi(options = {}) {
    const body = options.body;
    const headers = { ...(options.headers ?? {}) };
    if (body) {
      headers['content-type'] = 'application/json';
      headers['x-amz-content-sha256'] = await sha256(body);
    }
    const response = await fetch('/api/owner/preferences', {
      cache: 'no-store',
      ...options,
      headers,
    });
    if (response.status === 401) {
      location.href = '/login.html';
      throw new Error('認証が必要です');
    }
    const payload = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(payload.error ?? '表示設定の保存に失敗しました');
    return payload;
  }

  // インボックスの印。開かないと中身が分からない状態をなくすのが目的なので、
  // インボックスの画面にカードとして残っているもの（取り込みの済んでいないもの）を
  // 自分の依頼・Claudeからの確認の別なく数える。消えるのは完了した時点。
  // 失敗しても黙って見送る。印が出ないだけで、一覧の表示は妨げない。
  async function refreshInboxDot() {
    if (!CAN_SYNC) return;
    try {
      const response = await fetch('/api/owner/reviews', { cache: 'no-store' });
      if (!response.ok) return;
      const payload = await response.json();
      const open = (payload.items ?? []).filter((item) => item.status !== 'completed');
      $('review-dot').hidden = open.length === 0;
    } catch (error) {
      console.warn(error);
    }
  }

  async function persistPreferencesRemote() {
    if (!CAN_SYNC) return;
    const body = JSON.stringify({
      starredSources: [...starred],
      recentSources: [],
      hiddenSources: [...hiddenSources],
      readMarks,
      shelfDone: [...shelfDone],
      shelfAdded,
    });
    await preferencesApi({ method: 'PUT', body });
  }

  function queuePreferenceSave() {
    saveLocalPreferences();
    if (!CAN_SYNC) return;
    clearTimeout(preferenceSaveTimer);
    preferenceSaveTimer = setTimeout(() => {
      persistPreferencesRemote().catch((error) => console.warn(error));
    }, 250);
  }

  function pruneReadMarks(validSources) {
    readMarks = Object.fromEntries(
      Object.entries(readMarks).filter(([source]) => validSources.has(source)),
    );
  }

  // 既読の記録・マージ・書き戻し判定はすべて page-list.js が正本。ここは呼ぶだけにする
  const seedReadMarks = () => L.seedReadMarks(allPages, readMarks);
  const hasUnsyncedReadMarks = (remoteMarks) => L.hasUnsyncedReadMarks(readMarks, remoteMarks);

  async function loadPreferences() {
    const hadLocalReadMarks = knowsReadMarks;
    const validSources = new Set(allPages.map((page) => page.source));
    const validStreams = new Set(allPages.map(pageStream));
    starred = new Set([...starred].filter((value) => isValidStarValue(value, validSources, validStreams)));
    hiddenSources = new Set([...hiddenSources].filter((source) => validSources.has(source)));
    // 棚から消えた項目の印は持ち続けない（保存の上限に当たらないようにする）
    const validShelf = new Set((meta?.shelf ?? []).map((item) => item.id));
    shelfDone = new Set([...shelfDone].filter((id) => validShelf.has(id)));
    // ページが1件も無くなったテーマは、足した記録も持ち続けない
    shelfAdded = shelfAdded.filter((key) => validStreams.has(key));
    pruneReadMarks(validSources);
    pages = allPages.filter((page) => !hiddenSources.has(page.source));
    updateTrashToggle();
    if (!CAN_SYNC) {
      if (!hadLocalReadMarks) seedReadMarks();
      saveLocalPreferences();
      return;
    }
    saveLocalPreferences();

    try {
      const saved = await preferencesApi();
      if (saved.exists) {
        starred = new Set((saved.starredSources ?? [])
          .filter((value) => isValidStarValue(value, validSources, validStreams)));
        hiddenSources = new Set((saved.hiddenSources ?? []).filter((source) => validSources.has(source)));
        // 進行中は足す・外すの両方向があるので、和集合にせずスターと同じく保存値を正とする
        shelfDone = new Set((saved.shelfDone ?? [])
          .filter((id) => typeof id === 'string' && validShelf.has(id)));
        shelfAdded = [...new Set((saved.shelfAdded ?? [])
          .filter((key) => typeof key === 'string' && validStreams.has(key)))];
        const needsPush = hasUnsyncedReadMarks(saved.readMarks);
        readMarks = L.mergeReadMarks(readMarks, saved.readMarks ?? {});
        pruneReadMarks(validSources);
        // どちらにも既読の記録が無ければ、この機能を使い始めた回。全ページを既読から始める
        const firstRun = !hadLocalReadMarks && saved.readMarks === null;
        if (firstRun) seedReadMarks();
        saveLocalPreferences();
        if (needsPush || firstRun) await persistPreferencesRemote();
      } else {
        if (!hadLocalReadMarks) seedReadMarks();
        saveLocalPreferences();
        await persistPreferencesRemote();
      }
    } catch (error) {
      console.warn(error);
    }
    pages = allPages.filter((page) => !hiddenSources.has(page.source));
    updateTrashToggle();
  }

  function updateTrashToggle() {
    trashToggle.classList.toggle('on', hiddenSources.size > 0);
    trashLabel.textContent = showingTrash
      ? '‹ 一覧へ戻る'
      : `削除済み ${hiddenSources.size}件 ›`;
  }

  async function savePreferencesNow() {
    saveLocalPreferences();
    await persistPreferencesRemote();
  }

  async function hidePage(page) {
    if (!confirm(`「${page.title}」を共有くんの一覧から削除します。\n\n原本と発行済みURLは残り、一覧の末尾の「削除済み」から戻せます。`)) return;
    const previousHidden = new Set(hiddenSources);
    const previousStarred = new Set(starred);
    hiddenSources.add(page.source);
    starred.delete(page.source);
    pages = allPages.filter((candidate) => !hiddenSources.has(candidate.source));
    updateTrashToggle();
    try {
      await savePreferencesNow();
      location.hash = '#/';
    } catch (error) {
      hiddenSources = previousHidden;
      starred = previousStarred;
      pages = allPages.filter((candidate) => !hiddenSources.has(candidate.source));
      saveLocalPreferences();
      updateTrashToggle();
      renderHome();
      alert(error.message);
    }
  }

  async function restorePage(page) {
    const previousHidden = new Set(hiddenSources);
    const previousShowingTrash = showingTrash;
    hiddenSources.delete(page.source);
    pages = allPages.filter((candidate) => !hiddenSources.has(candidate.source));
    if (hiddenSources.size === 0) showingTrash = false;
    try {
      await savePreferencesNow();
    } catch (error) {
      hiddenSources = previousHidden;
      showingTrash = previousShowingTrash;
      pages = allPages.filter((candidate) => !hiddenSources.has(candidate.source));
      saveLocalPreferences();
      alert(error.message);
    }
    updateTrashToggle();
    renderHome();
    setStamp();
  }

  function toggleStar(page) {
    if (isStarred(page)) starred.delete(page.source);
    else starred.add(page.source);
    queuePreferenceSave();
    if (current?.source === page.source) syncPageMenu();
    renderHome();
  }

  // ☆ボタンは page-list.js が正本。トップの行もスマホのドロワーも同じものを使う
  const starButton = (page) => L.starButton(page, { starred, onToggle: toggleStar });

  function toggleStreamStar(stream) {
    const id = streamStarId(stream.key);
    if (starred.has(id)) starred.delete(id);
    else starred.add(id);
    queuePreferenceSave();
    renderHome();
  }

  const streamStarButton = (stream) => L.starButton(
    { source: streamStarId(stream.key), title: `${stream.label}カード` },
    { starred, onToggle: () => toggleStreamStar(stream) },
  );

  /** ページを開く */
  function openPage(page) {
    // iPhoneで iframe 内をスクロールすると、端末のセーフエリアが本文へ伝わらず、
    // ステータスバーの「画面上端タップで先頭へ」も効かない。
    // スマホでは全ページをトップレベルで開き、各ページ固有の背景と
    // Safari 本来の単一スクロール領域をそのまま使う。
    if (isNarrow()) {
      // 遷移してしまうので、サーバーへの保存を待たずに手元へ書く。
      // 取りこぼしても次回の読み込み時にマージして書き戻される
      markRead(page);
      location.href = new URL(page.href, location.href).toString();
      return;
    }
    location.hash = `#/${page.slug}`;
  }

  /**
   * 更新の新しい順に並んだページを、テーマ単位の塊へ束ねる。
   * pages は manifest の時点で新しい順なので、Map の挿入順がそのまま
   * 「最終更新の新しいテーマ順」になる。
   */
  function groupByStream(items) {
    const streams = new Map();
    for (const page of items) {
      const key = pageStream(page);
      if (!streams.has(key)) streams.set(key, { key, label: pageStreamLabel(page), pages: [] });
      streams.get(key).pages.push(page);
    }
    return [...streams.values()];
  }

  /** 1 行 = 1 ページ。タイトル・共有マーク・更新時刻・スターだけに絞る */
  function pageRow(page, { indented, trash = false }) {
    const wrap = document.createElement('div');
    wrap.className = `row-wrap${indented ? ' in' : ''}`;

    // button ではなく a。⌘クリック・中クリックで別タブに開けるようにするため。
    // 削除済みの行は開けないので、ただの div にする
    const button = document.createElement(trash ? 'div' : 'a');
    button.className = `row${indented ? ' in' : ''}${trash ? ' off' : ''}`;
    button.title = page.source;   // ヘッダーを廃したので出典はツールチップで見せる

    const dot = document.createElement('span');
    const fresh = !trash && isNew(page);
    dot.className = `dot${fresh ? ' on' : ''}`;
    if (fresh) {
      // 行が狭く「新着」の2文字を置けないので、太字と読み上げラベルで色以外の手がかりを残す
      dot.setAttribute('role', 'img');
      dot.setAttribute('aria-label', '新着');
    }

    const title = document.createElement('div');
    title.className = 't';
    title.textContent = page.title;
    button.append(dot, title);

    if (page.sharedHref) {
      const mark = document.createElement('span');
      mark.className = 'sh';
      const isOpen = page.shareMode === 'public';
      mark.textContent = isOpen ? '🌐' : '🔗';
      mark.title = isOpen ? 'IP制限なしで公開中' : '社内IP限定の共有リンクあり';
      button.append(mark);
    }

    const when = document.createElement('time');
    when.dateTime = page.date;
    when.textContent = shortTime(page.date);
    when.title = `更新 ${fmtDateTime(page.date)}`;
    button.append(when);

    if (trash) {
      const restore = document.createElement('button');
      restore.className = 'restore';
      restore.type = 'button';
      restore.textContent = '戻す';
      restore.addEventListener('click', () => restorePage(page));
      wrap.append(button, restore);
      return wrap;
    }

    L.bindOpen(button, page, openPage);
    wrap.append(button, starButton(page));
    return wrap;
  }

  /** カード見出しの「進行中へ入れる」。押すとヘッダーのチップ列へ足し、もう一度押すと外す */
  function shelfPinButton(stream) {
    const item = liveShelf().find((i) => i.stream === stream.key);
    const on = Boolean(item);
    const b = document.createElement('button');
    b.type = 'button';
    b.className = `shelf-pin${on ? ' on' : ''}`;
    b.setAttribute('aria-pressed', String(on));
    b.title = on ? '進行中から外す' : '進行中に入れる';
    b.setAttribute('aria-label', `${stream.label}を${b.title}`);
    b.innerHTML = on
      ? '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6.5" width="19" height="11" rx="5.5" class="fill"/><path d="M8.5 12.2l2.3 2.3 4.7-4.7" class="mark"/></svg>'
      : '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6.5" width="19" height="11" rx="5.5"/><path d="M12 9.3v5.4M9.3 12h5.4"/></svg>';
    b.addEventListener('click', (event) => {
      event.stopPropagation();
      if (item) doneShelfItem(item);
      else addShelfStream(stream.key);
    });
    return b;
  }

  /** テーマ1つぶんの塊。1件しかないテーマは見出しを付けず、単独の行として置く */
  function appendStream(parent, stream) {
    if (stream.pages.length === 1) {
      const solo = document.createElement('section');
      solo.className = 'solo';
      solo.append(pageRow(stream.pages[0], { indented: false }));
      parent.append(solo);
      return;
    }

    const section = document.createElement('section');
    section.className = 'theme';

    const head = document.createElement('div');
    head.className = 'th';
    const name = document.createElement('span');
    name.className = 'tname';
    name.textContent = stream.label;
    head.append(name);

    const count = document.createElement('span');
    count.className = 'tcount';
    count.textContent = `${stream.pages.length}件`;
    // 更新時刻は各行に出ているので見出しには置かない（拡大表示で見出しが折り返す原因になる）
    head.append(count, shelfPinButton(stream), streamStarButton(stream));
    section.append(head);

    // 絞り込み中は「他N件」で隠さない。探している1件が畳まれた中にいると見つけられない
    const expanded = expandedStreams.has(stream.key) || filterText.trim() !== '' || shelfFilter !== null;
    const shown = expanded ? stream.pages : stream.pages.slice(0, STREAM_PREVIEW);
    for (const page of shown) section.append(pageRow(page, { indented: true }));

    const hidden = stream.pages.length - shown.length;
    if (filterText.trim() === '' && shelfFilter === null && (hidden > 0 || expanded)) {
      const more = document.createElement('button');
      more.className = 'more';
      more.type = 'button';
      more.textContent = expanded ? '折りたたむ ‹' : `他 ${hidden} 件を表示 ›`;
      more.setAttribute('aria-expanded', String(expanded));
      more.addEventListener('click', () => {
        if (expanded) expandedStreams.delete(stream.key);
        else expandedStreams.add(stream.key);
        renderHome();
      });
      section.append(more);
    }
    parent.append(section);
  }

  function appendDateGroup(label, streams) {
    if (streams.length === 0) return;
    const wrap = document.createElement('div');
    wrap.className = 'dgroup';

    const head = document.createElement('div');
    head.className = 'dhead';
    const title = document.createElement('span');
    title.textContent = label;
    const count = document.createElement('span');
    count.className = 'dcount';
    const total = streams.reduce((sum, stream) => sum + stream.pages.length, 0);
    count.textContent = streams.length === total
      ? `${total}件`
      : `${streams.length}テーマ・${total}件`;
    head.append(title, count);
    wrap.append(head);

    const body = document.createElement('div');
    body.className = 'dbody';
    for (const stream of streams) appendStream(body, stream);
    wrap.append(body);
    tilesEl.append(wrap);
  }

  /** いま並べる対象。削除済み表示か通常かを決めたうえで、検索語で絞る */
  function visiblePages() {
    const base = showingTrash
      ? allPages.filter((page) => hiddenSources.has(page.source))
      : pages;
    const needle = filterText.trim().toLowerCase();
    if (!needle) return base;
    return base.filter((page) => `${page.title} ${pageRepository(page)} ${page.source}`
      .toLowerCase().includes(needle));
  }

  /** 棚の締切を「あと◯日・9/30（水）」の形にする。日付は JST の暦日で数える */
  function shelfDueLabel(due) {
    if (!due) return { text: '', soon: false };
    const W = '日月火水木金土';
    const [y, m, d] = due.split('-').map(Number);
    const dueDay = Date.UTC(y, m - 1, d);
    const now = new Date(Date.now() + 9 * 3600e3);
    const today = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
    const diff = Math.round((dueDay - today) / 86400e3);
    const date = `${m}/${d}（${W[new Date(dueDay).getUTCDay()]}）`;
    const rel = diff < 0 ? '昨日まで' : diff === 0 ? '今日' : diff === 1 ? '明日' : `あと${diff}日`;
    return { text: `${rel}・${date}`, soon: diff <= 3 };
  }

  /** 進行中から外す。台帳（設定の shelf）の項目は下ろした印を、自分で足したテーマは足した記録を消す */
  function doneShelfItem(item) {
    if (item.added) shelfAdded = shelfAdded.filter((key) => key !== item.stream);
    else shelfDone.add(item.id);
    if (shelfFilter === item.stream) shelfFilter = null;
    queuePreferenceSave();
    renderHome();
  }

  /** テーマを進行中へ足す。台帳にあって下ろしていた項目なら、下ろした印を外して締切ごと戻す */
  function addShelfStream(streamKey) {
    const ledger = (meta?.shelf ?? []).find((item) => item.stream === streamKey);
    if (ledger && shelfDone.has(ledger.id)) shelfDone.delete(ledger.id);
    else if (!ledger && !shelfAdded.includes(streamKey)) shelfAdded.push(streamKey);
    queuePreferenceSave();
    renderHome();
  }

  const STAR_FILTER = '@star';
  /** テーマごとの名前・件数・最終更新（削除済みは数えない） */
  function streamSummaries() {
    const map = new Map();
    for (const page of pages) {
      const key = pageStream(page);
      if (!map.has(key)) map.set(key, { key, label: pageStreamLabel(page), count: 0, last: page.date });
      const summary = map.get(key);
      summary.count += 1;
      if (Date.parse(page.date) > Date.parse(summary.last)) summary.last = page.date;
    }
    return map;
  }
  /**
   * いま進行中に並ぶ項目。台帳の項目（締切順）のあとに、自分で足したテーマを足した順で続ける。
   * 台帳のテーマの項目は、そのテーマのページが実在するものだけを出す
   */
  function liveShelf() {
    const ledger = (meta?.shelf ?? []).filter((item) => !shelfDone.has(item.id)
      && (item.url || allPages.some((candidate) => candidate.slug === item.slug)));
    const onShelf = new Set(ledger.map((item) => item.stream).filter(Boolean));
    const summaries = streamSummaries();
    const added = shelfAdded
      .filter((key) => !onShelf.has(key) && summaries.has(key))
      .map((key) => {
        const summary = summaries.get(key);
        return { id: `@added:${key}`, title: summary.label, stream: key, count: summary.count, last: summary.last, due: null, added: true };
      });
    return [...ledger, ...added];
  }
  // ページのスターと、テーマ見出し（カード）のスターの両方を「スター」の絞り込みに含める
  const pageIsStarred = (page) => isStarred(page) || starred.has(streamStarId(pageStream(page)));

  /** 締切をチップ用に短くする（「今日」「明日」「5日」）。3日以内は強調 */
  function chipDue(due) {
    if (!due) return null;
    const [y, m, d] = due.split('-').map(Number);
    const now = new Date(Date.now() + 9 * 3600e3);
    const diff = Math.round((Date.UTC(y, m - 1, d)
      - Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate())) / 86400e3);
    const text = diff < 0 ? '昨日まで' : diff === 0 ? '今日' : diff === 1 ? '明日' : `${diff}日`;
    return { text, soon: diff <= 3 };
  }

  function chip(label, { on = false, count = null, due = null, onClick, onDone = null, link = false }) {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = `chip${on ? ' on' : ''}${link ? ' link' : ''}`;
    el.setAttribute('aria-pressed', String(on));
    const name = document.createElement('span');
    name.textContent = label;
    el.append(name);
    const sub = due ?? (count === null ? null : { text: String(count), soon: false });
    if (sub || link) {
      const n = document.createElement('span');
      n.className = `n${sub?.soon ? ' soon' : ''}`;
      n.textContent = sub?.text ?? '';
      el.append(n);
    }
    el.addEventListener('click', onClick);
    // ✕ は選択中のチップと、編集中の全チップに出す
    if (onDone && (on || chipEditing)) {
      const x = document.createElement('span');
      x.className = 'x';
      x.setAttribute('role', 'button');
      x.setAttribute('aria-label', `${label}を棚から下ろす`);
      x.title = '棚から下ろす（ページは消えません）';
      x.textContent = '✕';
      x.addEventListener('click', (event) => { event.stopPropagation(); onDone(); });
      el.append(x);
    }
    return el;
  }

  /** ヘッダーの絞り込みチップ。すべて → スター → 棚の項目（締切の近い順） */
  function renderChips() {
    const bar = $('chips');
    bar.replaceChildren();
    bar.classList.toggle('editing', chipEditing);
    // 追加の候補は、削除済みの表示と検索中には自分で隠れる
    renderChipPicker();
    // 削除済みの表示と検索中は絞り込みを使わない
    if (showingTrash || filterText.trim()) return;
    const select = (key) => () => { shelfFilter = shelfFilter === key ? null : key; renderHome(); };
    bar.append(chip('すべて', { on: shelfFilter === null, onClick: () => { shelfFilter = null; renderHome(); } }));
    const starCount = pages.filter(pageIsStarred).length;
    if (starCount > 0) {
      bar.append(chip('★ スター', { on: shelfFilter === STAR_FILTER, count: starCount, onClick: select(STAR_FILTER) }));
    }
    for (const item of liveShelf()) {
      if (item.url) {
        bar.append(chip(item.title, {
          due: chipDue(item.due), link: true,
          onClick: () => window.open(item.url, '_blank', 'noopener,noreferrer'),
          onDone: () => doneShelfItem(item),
        }));
        continue;
      }
      bar.append(chip(item.title, {
        on: shelfFilter === item.stream,
        due: chipDue(item.due) ?? { text: String(item.count), soon: false },
        onClick: select(item.stream),
        onDone: () => doneShelfItem(item),
      }));
    }
    // 並びの最後に、足し引きの入口を置く。ふだんは鉛筆だけ、編集中は「＋ 追加」と「完了」
    if (chipEditing) {
      const add = document.createElement('button');
      add.type = 'button';
      add.className = `chip ghost${chipPicking ? ' on' : ''}`;
      add.textContent = '＋ 追加';
      add.setAttribute('aria-expanded', String(chipPicking));
      add.addEventListener('click', () => { chipPicking = !chipPicking; renderHome(); });
      bar.append(add);
    }
    const edit = document.createElement('button');
    edit.type = 'button';
    edit.className = `chip ghost edit${chipEditing ? ' on' : ''}`;
    edit.setAttribute('aria-label', chipEditing ? '編集を終える' : '進行中を編集する');
    edit.title = chipEditing ? '編集を終える' : '進行中を足す・外す';
    edit.innerHTML = chipEditing
      ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"/></svg>完了'
      : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg>';
    edit.addEventListener('click', () => {
      chipEditing = !chipEditing;
      chipPicking = false;
      renderHome();
    });
    bar.append(edit);
  }

  /** 「＋ 追加」で開く候補。進行中に無いテーマを最近動いた順に並べ、押すたびに1つずつ足す */
  function renderChipPicker() {
    const box = $('chip-picker');
    box.replaceChildren();
    box.hidden = !(chipEditing && chipPicking) || showingTrash || Boolean(filterText.trim());
    if (box.hidden) return;
    const onShelf = new Set(liveShelf().map((item) => item.stream).filter(Boolean));
    const candidates = [...streamSummaries().values()]
      .filter((summary) => !onShelf.has(summary.key))
      .sort((a, b) => Date.parse(b.last) - Date.parse(a.last))
      .slice(0, 24);
    const head = document.createElement('p');
    head.className = 'picker-head';
    head.textContent = '進行中に足すテーマ（最近動いた順）';
    box.append(head);
    if (candidates.length === 0) {
      const none = document.createElement('p');
      none.className = 'picker-empty';
      none.textContent = '足せるテーマはありません';
      box.append(none);
      return;
    }
    const list = document.createElement('div');
    list.className = 'picker-list';
    for (const summary of candidates) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'picker-item';
      button.title = summary.label;
      const name = document.createElement('span');
      name.textContent = summary.label;
      const sub = document.createElement('span');
      sub.className = 'n';
      sub.textContent = `${summary.count}件・${shortTime(summary.last)}`;
      button.append(name, sub);
      button.addEventListener('click', () => addShelfStream(summary.key));
      list.append(button);
    }
    box.append(list);
  }

  /** 絞り込み中の1行。何で絞っているかと、締切・メモ・件数を本文の先頭に出す */
  function renderFilterNote(count) {
    const note = $('filter-note');
    if (!shelfFilter || showingTrash) { note.hidden = true; return; }
    const item = liveShelf().find((candidate) => !candidate.url && candidate.stream === shelfFilter);
    note.hidden = false;
    note.replaceChildren();
    const b = document.createElement('b');
    b.textContent = shelfFilter === STAR_FILTER ? '★ スター' : (item?.title ?? '');
    const parts = [];
    if (item?.due) parts.push(shelfDueLabel(item.due).text);
    if (item?.note) parts.push(item.note);
    parts.push(`${count}ページ`);
    note.append(b, document.createTextNode(`　${parts.join('・')}`));
  }

  // ── トップ: 日付の区切り（中はテーマ単位の塊）。スターと進行中はヘッダーのチップで絞る
  function renderHome() {
    tilesEl.replaceChildren();
    // チップで選んだ絞り込みは、下ろされたり検索を始めたり棚から消えたりしたら解除する
    const shelfStreams = new Set(liveShelf().filter((item) => item.stream).map((item) => item.stream));
    shelfStreams.add(STAR_FILTER);
    if (shelfFilter && (showingTrash || filterText.trim() || !shelfStreams.has(shelfFilter))) shelfFilter = null;
    const items = shelfFilter === STAR_FILTER
      ? visiblePages().filter(pageIsStarred)
      : shelfFilter
        ? visiblePages().filter((page) => pageStream(page) === shelfFilter)
        : visiblePages();
    renderChips();
    renderFilterNote(items.length);

    if (items.length === 0) {
      const none = document.createElement('div');
      none.className = 'empty';
      none.textContent = showingTrash
        ? '削除済みのページはありません'
        : (filterText.trim() ? `「${filterText.trim()}」に当てはまるページはありません` : 'ページがありません');
      tilesEl.append(none);
      return;
    }

    if (showingTrash) {
      const wrap = document.createElement('div');
      wrap.className = 'dgroup';
      const head = document.createElement('div');
      head.className = 'dhead';
      const title = document.createElement('span');
      title.textContent = '削除済み';
      const count = document.createElement('span');
      count.className = 'dcount';
      count.textContent = `${items.length}件`;
      head.append(title, count);
      const body = document.createElement('div');
      body.className = 'dbody';
      for (const page of items) {
        const solo = document.createElement('section');
        solo.className = 'solo';
        solo.append(pageRow(page, { indented: false, trash: true }));
        body.append(solo);
      }
      wrap.append(head, body);
      tilesEl.append(wrap);
      return;
    }

    // スターと進行中はヘッダーのチップへ移した。一覧は日付の区切りだけにする
    const rest = items;

    // テーマは最終更新日で区切りが決まる。今日1件でも触ったテーマは、
    // 過去の版を引き連れて「今日」へ上がってくる
    const groups = [];
    for (const stream of groupByStream(rest)) {
      const label = dateGroup(stream.pages[0].date);
      const last = groups.at(-1);
      if (last?.label === label) last.streams.push(stream);
      else groups.push({ label, streams: [stream] });
    }
    for (const group of groups) appendDateGroup(group.label, group.streams);
  }

  function setStamp() {
    if (!meta) return;
    brandMeta.textContent = `${shortTime(meta.generatedAt)} 更新`;
    brandMeta.title = `最終更新 ${fmtDateTime(meta.generatedAt)}`;
  }

  function loadFrame(url) {
    const view = frame.contentWindow;
    if (!view) {
      frame.src = url;
      return;
    }
    try {
      view.location.replace(url);
    } catch {
      frame.src = url;
    }
  }

  function configureShareOptions(manifest) {
    const scope = $('page-share-scope');
    if (!manifest.internalSharing) {
      scope.querySelector('option[value="i"]')?.remove();
      scope.value = 'p';
    }

    const maximumDays = Number(manifest.maximumShareDays);
    const days = $('page-share-days');
    if (Number.isInteger(maximumDays) && maximumDays > 0) {
      for (const option of [...days.options]) {
        if (Number(option.value) > maximumDays) option.remove();
      }
      const available = [...days.options].map((option) => Number(option.value));
      days.value = String(available.includes(7) ? 7 : available.at(-1));
    }
  }

  function select(slug) {
    current = pages.find((p) => p.slug === slug) ?? null;
    document.body.classList.toggle('page-open', Boolean(current));
    document.body.classList.remove('page-controls-hidden');
    closePagePopovers();
    syncPageMenu();

    if (!current) {
      frame.hidden = true;
      loadFrame('about:blank');
      renderHome();
      home.classList.add('on');
      document.title = 'HTML共有くん';
    } else {
      home.classList.remove('on');
      frame.hidden = false;
      loadFrame(current.href);
      document.title = `${current.title}｜HTML共有くん`;
      // ブックマークやURL直打ちで開いた場合もここを通るので、未読解除はまとめてここで行う
      markRead(current);
    }
    setStamp();
  }

  async function buildTimedShareUrl(page, mode, days) {
    const body = JSON.stringify({ slug: page.slug, scope: mode === 'i' ? 'internal' : 'public', days });
    const response = await fetch('/api/owner/shares', {
      method: 'POST',
      cache: 'no-store',
      headers: { 'content-type': 'application/json' },
      body,
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(result.error ?? '共有URLを発行できませんでした');
    return result;
  }

  function setPageControlsHidden(hidden) {
    if (!pageMenu.hidden || !pageSharePanel.hidden || !pageShareToast.hidden) hidden = false;
    document.body.classList.toggle('page-controls-hidden', hidden);
  }

  function closePagePopovers() {
    pageMenu.hidden = true;
    pageSharePanel.hidden = true;
    pageShareToast.hidden = true;
    pagePopoverDismiss.hidden = true;
    pageMore.setAttribute('aria-expanded', 'false');
    clearTimeout(shareToastTimer);
  }

  function syncPageMenu() {
    const on = Boolean(current && isStarred(current));
    pageStar.disabled = !current;
    pageStar.classList.toggle('starred', on);
    pageStar.querySelector('span').textContent = on ? 'スターを外す' : 'スターを付ける';
    // 開いた時点で既読になるので、押せるのは「いま開いているページがある」ときだけ
    pageUnread.disabled = !current;
  }

  function watchFrameScroll() {
    const frameWindow = frame.contentWindow;
    if (!frameWindow) return;
    let lastY = frameWindow.scrollY;
    frameWindow.addEventListener('scroll', () => {
      const nextY = frameWindow.scrollY;
      if (nextY <= 24 || nextY < lastY - 6) setPageControlsHidden(false);
      else if (nextY > lastY + 6) setPageControlsHidden(true);
      lastY = nextY;
    }, { passive: true });
  }

  function refreshApp() {
    document.body.classList.add('refreshing');
    location.reload();
  }

  // ── 検索。ふだんは虫めがねだけを置き、押したときだけ入力欄へ広げる ──
  const searchInput = $('q');
  function setSearching(open) {
    document.body.classList.toggle('searching', open);
    searchToggle.setAttribute('aria-expanded', String(open));
    searchToggle.setAttribute('aria-label', open ? '検索を閉じる' : '検索する');
    // 閉じている間は Tab の巡回から外し、虫めがね自体を押させる
    searchInput.tabIndex = open ? 0 : -1;
    // 検索中はチップ段を隠すので、チップの絞り込みも解除して全ページから探す
    if (open && shelfFilter !== null) {
      shelfFilter = null;
      renderHome();
    }
    if (open) searchInput.focus();
  }
  function applyFilter(value) {
    filterText = value;
    document.body.classList.toggle('has-query', value.trim() !== '');
    renderHome();
  }
  function closeSearch() {
    if (searchInput.value !== '') {
      searchInput.value = '';
      applyFilter('');
    }
    setSearching(false);
    searchInput.blur();
  }
  searchToggle.addEventListener('click', () => {
    if (document.body.classList.contains('searching')) closeSearch();
    else setSearching(true);
  });
  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    applyFilter('');
    searchInput.focus();
  });
  searchInput.addEventListener('input', (event) => applyFilter(event.target.value));
  searchInput.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') closeSearch();
  });
  // 語を入れないまま外れたときだけ畳む。入力済みなら結果を見ながら触れるよう開いておく
  searchInput.addEventListener('blur', () => {
    if (searchInput.value.trim() === '') setSearching(false);
  });
  // 「/」ですぐ検索へ。文字を打ちに行くとき以外は邪魔をしない
  addEventListener('keydown', (event) => {
    if (event.key !== '/' || event.metaKey || event.ctrlKey || event.altKey) return;
    if (document.body.classList.contains('page-open')) return;
    const tag = event.target?.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    event.preventDefault();
    setSearching(true);
  });

  // 名前を押したらトップへ戻る
  $('brand').addEventListener('click', () => {
    if (location.hash && location.hash !== '#/') location.hash = '#/';
    else home.scrollTo({ top: 0, behavior: 'smooth' });
  });
  $('home-btn').addEventListener('click', () => { location.hash = '#/'; });
  $('review').addEventListener('click', () => { location.href = '/review/index.html'; });
  refresh.addEventListener('click', refreshApp);
  pageRefresh.addEventListener('click', refreshApp);
  pageMore.addEventListener('click', () => {
    const willOpen = pageMenu.hidden && pageSharePanel.hidden;
    closePagePopovers();
    if (!willOpen) return;
    syncPageMenu();
    pageMenu.hidden = false;
    pagePopoverDismiss.hidden = false;
    pageMore.setAttribute('aria-expanded', 'true');
    setPageControlsHidden(false);
  });
  pageStar.addEventListener('click', () => {
    if (!current) return;
    toggleStar(current);
    closePagePopovers();
  });
  pageUnread.addEventListener('click', () => {
    const page = current;
    closePagePopovers();
    if (!markUnread(page)) return;
    // ここに留まると、再読み込みやページを開き直した拍子にまた既読へ倒れる。
    // 一覧へ戻して、黄色い「新着」に戻ったことをその場で見せる
    location.hash = '#/';
  });
  pageShare.addEventListener('click', () => {
    pageMenu.hidden = true;
    pageSharePanel.hidden = false;
    pageShareToast.hidden = true;
    pagePopoverDismiss.hidden = false;
    pageMore.setAttribute('aria-expanded', 'true');
  });
  pageDelete.addEventListener('click', () => {
    closePagePopovers();
    if (current) hidePage(current);
  });
  pageShareIssue.addEventListener('click', async () => {
    const page = current;
    if (!page) return;
    const mode = $('page-share-scope').value;
    const days = Number($('page-share-days').value);
    if (!Number.isInteger(days) || days < 1 || days > 90) return;
    if (
      mode === 'p' &&
      !confirm(`「${page.title}」をIP制限なしで${days}日間共有します。よろしいですか？`)
    ) return;

    pageShareIssue.disabled = true;
    pageShareIssue.textContent = '発行中…';
    let generatedUrl = '';
    try {
      const { url, expiresAt } = await buildTimedShareUrl(page, mode, days);
      generatedUrl = url;
      await navigator.clipboard.writeText(url);
      const expires = new Date(expiresAt * 1000).toLocaleString('ja-JP', {
        timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit',
      });
      pageSharePanel.hidden = true;
      pageMore.setAttribute('aria-expanded', 'false');
      pageShareToast.querySelector('strong').textContent = 'コピーしました';
      pageShareToast.querySelector('.toast-meta').textContent = `${expires}まで有効`;
      pageShareToast.hidden = false;
      pagePopoverDismiss.hidden = false;
      clearTimeout(shareToastTimer);
      shareToastTimer = setTimeout(closePagePopovers, 2500);
    } catch (error) {
      console.error(error);
      if (generatedUrl) {
        prompt('このURLをコピーしてください', generatedUrl);
      } else {
        pageSharePanel.hidden = true;
        pageMore.setAttribute('aria-expanded', 'false');
        pageShareToast.querySelector('strong').textContent = '発行できませんでした';
        pageShareToast.querySelector('.toast-meta').textContent = error instanceof Error ? error.message : String(error);
        pageShareToast.hidden = false;
        pagePopoverDismiss.hidden = false;
        clearTimeout(shareToastTimer);
        shareToastTimer = setTimeout(closePagePopovers, 5000);
      }
    } finally {
      pageShareIssue.disabled = false;
      pageShareIssue.textContent = '発行してコピー';
    }
  });
  trashToggle.addEventListener('click', () => {
    showingTrash = !showingTrash;
    updateTrashToggle();
    renderHome();
  });
  frame.addEventListener('load', watchFrameScroll);
  pagePopoverDismiss.addEventListener('pointerdown', closePagePopovers);
  document.addEventListener('pointerdown', (event) => {
    if ($('page-actions').contains(event.target) || event.target === pagePopoverDismiss) return;
    closePagePopovers();
  });
  document.addEventListener('keydown', (event) => {
    if (event.key !== 'Escape') return;
    if (pageMenu.hidden && pageSharePanel.hidden && pageShareToast.hidden) return;
    event.preventDefault();
    closePagePopovers();
  });

  addEventListener('hashchange', () => select(location.hash.replace(/^#\//, '')));

  // インボックスで答えて戻る、他のアプリから切り替えて戻る、ホーム画面のPWAを開き直す——
  // どれも一覧を読み込み直さずに前面へ戻るので、印だけ取り直す
  addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') refreshInboxDot();
  });

  fetch('manifest.json', { cache: 'no-store' })
    .then((r) => r.json())
    .then(async (data) => {
      meta = data;
      configureShareOptions(data);
      allPages = data.pages ?? [];
      await loadPreferences();
      select(location.hash.replace(/^#\//, ''));
      refreshInboxDot();
    })
    .catch((err) => {
      brandMeta.textContent = '一覧の読み込みに失敗しました';
      console.error(err);
    });
})();
</script>
</body>
</html>
