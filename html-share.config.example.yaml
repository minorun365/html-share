ownerEmail: owner@example.com

aws:
  region: ap-northeast-1
  consoleDomain: html-share-console.example.com
  contentDomain: html-share-content.example.com
  certificateArn: arn:aws:acm:us-east-1:111122223333:certificate/00000000-0000-4000-8000-000000000000
  cognitoDomainPrefix: html-share-example
  publicKeyPath: .html-share/keys/public.pem
  privateKeyPath: .html-share/keys/private.pem
  privateKeyParameterName: /html-share/cloudfront/private-key

content:
  roots:
    - examples
  pages:
    - path: examples/demo-report.html
      title: デモレポート
      slug: demo-report
      repository: examples
      stream: demo
      streamLabel: デモ
  ownerLinkDays: 30
  maximumShareDays: 30
  maximumAssetBytes: 10485760
  # 社内限定URLを使う場合だけ、組織の出口IPをCIDRで指定します。
  allowedInternalCidrs:
    - 203.0.113.0/24

  # ── リンクプレビュー（OGP） ───────────────────────────────────────
  # 共有したURLをSlackやTeamsへ貼ったときに出るカードの中身です。
  # siteName はカードに出るアプリ名。省略すると「#HTML共有くん」になります。
  siteName: "#HTML共有くん"
  # ogImageUrl はカードに出す画像。省略すると同梱の画像（assets/og-card.jpg）を
  # 配信先の /og/card.jpg へ置いて使います（/og/* だけは署名なしで開ける設定です）。
  # 自前の画像を使うなら絶対URL（https）を書きます。認証なしで取れる場所に置き、
  # URLを直接叩いて 200 と Content-Type: image/* が返ることを確かめてください。
  # false にすると画像なしのカードになります（Teams は og:image が無いとカードを出しません）。
  # ogImageUrl: https://example.com/og-card.png
  # ogCardType はカードの大きさ。省略すると summary（各媒体でいちばん小さいカード）です。
  # summary_large_image は 1200x630 前後の横長画像を前提にした見せ方で、
  # 正方形やロゴを渡すと引き伸ばされます。
  # ogCardType: summary_large_image

  # ── 進行中の棚 ────────────────────────────────────────────────────
  # 一覧のスターの下に「まだ終わっていない仕事」を1行ずつ並べます。省略すると棚は出ません。
  # stream を書くとそのテーマの最新ページへ、url を書くとそのリンクへ飛びます（どちらか一方）。
  # due（YYYY-MM-DD）の翌日を過ぎた項目と done: true の項目は、publish 時に棚から落ちます。
  # 画面の ✓ で下ろした印は本人設定として同期され、この設定ファイルは書き換えません。
  # shelf:
  #   - id: demo-review
  #     title: デモレポートの見直し
  #     stream: demo
  #     due: 2026-01-31
  #     note: 数字の出典を確認する
  #   - id: team-thread
  #     title: チャットの問い合わせに返信
  #     url: https://chat.example.com/threads/12345
  #     added: 2026-01-20
