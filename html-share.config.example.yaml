ownerEmail: owner@example.com

aws:
  region: ap-northeast-1
  consoleDomain: html-share-console.example.com
  contentDomain: html-share-content.example.com
  certificateArn: arn:aws:acm:us-east-1:111122223333:certificate/00000000-0000-4000-8000-000000000000
  cognitoDomainPrefix: html-share-example
  publicKeyPath: .html-share/keys/public.pem
  privateKeyPath: .html-share/keys/private.pem
  privateKeyParameterName: /html-share/cloudfront/private-key

content:
  roots:
    - examples
  pages:
    - path: examples/demo-report.html
      title: デモレポート
      slug: demo-report
      repository: examples
      stream: demo
      streamLabel: デモ
      # 進行中チップに出す短い名前（全角1・半角0.5で数えて11まで）。同じテーマのどれか1ページに書けば足ります。
      # 省略すると streamLabel、それも無ければ stream をそのまま出します。
      # streamLabel があるのに streamChip が無いテーマと、長すぎるテーマは publish 時に警告します
      streamChip: デモ
  ownerLinkDays: 30
  maximumShareDays: 30
  # 最終更新からこの日数を過ぎたページを配信から外し、一覧の「保管庫」にタイトルだけ残します。
  # 省略すると保管庫へは移しません。長く残したいページには pages の各項目へ keep: 2026-03-31（見直し日）を書きます。
  # 戻すときは html-share page revive <slug>。詳しくは docs/retention.md
  retainDays: 30
  maximumAssetBytes: 10485760
  # 社内限定URLを使う場合だけ、組織の出口IPをCIDRで指定します。
  allowedInternalCidrs:
    - 203.0.113.0/24

  # ── リンクプレビュー（OGP） ───────────────────────────────────────
  # 共有したURLをSlackやTeamsへ貼ったときに出るカードの中身です。
  # siteName はカードに出るアプリ名。省略すると「#HTML共有くん」になります。
  siteName: "#HTML共有くん"
  # ogImageUrl はカードに出す画像。省略すると同梱の画像（assets/og-card.jpg）を
  # 配信先の /og/card.jpg へ置いて使います（/og/* だけは署名なしで開ける設定です）。
  # 自前の画像を使うなら絶対URL（https）を書きます。認証なしで取れる場所に置き、
  # URLを直接叩いて 200 と Content-Type: image/* が返ることを確かめてください。
  # false にすると画像なしのカードになります（Teams は og:image が無いとカードを出しません）。
  # ogImageUrl: https://example.com/og-card.png
  # ogCardType はカードの大きさ。省略すると summary（各媒体でいちばん小さいカード）です。
  # summary_large_image は 1200x630 前後の横長画像を前提にした見せ方で、
  # 正方形やロゴを渡すと引き伸ばされます。
  # ogCardType: summary_large_image

  # ── 進行中フィルター ────────────────────────────────────────────────────
  # ヘッダーの絞り込みチップに「まだ終わっていない仕事」を並べます。省略すると進行中フィルターは出ません。
  # チップは押すと一覧の絞り込みになり、外部のページへは飛びません。stream と url の少なくとも一方を書きます。
  # stream の項目は一覧をそのテーマに絞り、title を省くとテーマの streamChip を名前にします。
  # url は絞り込み中の見出しに「元のスレッド ↗」として出します（stream と一緒に書いても構いません）。
  # 期限はテーマごとに streamDues へ書きます（下の例）。進行中フィルターの項目にも、画面の押しピンで足したテーマにも
  # 同じ期限が出て、画面が今日以降でいちばん近い日を選びます。節目が複数あれば全部並べると、
  # 過ぎた翌朝に publish し直さなくても次の日へ繰り上がります。url だけの項目は due（YYYY-MM-DD）に書きます。
  # 期限の最後の日の翌日を過ぎた項目と done: true の項目は、進行中フィルターから外れます。
  # 画面の ✓ で外した印は本人設定として同期され、この設定ファイルは書き換えません。
  # shelf:
  #   - id: demo-review
  #     stream: demo
  #     note: 数字の出典を確認する
  #   - id: team-thread
  #     title: チャットの問い合わせに返信
  #     url: https://chat.example.com/threads/12345
  #     added: 2026-01-20
  # streamDues:
  #   demo: { 2026-01-24: リハーサル, 2026-01-31: 本番 }
